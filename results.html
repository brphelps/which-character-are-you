<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore your six-dimensional UHCI personality profile, compare Muppet characters, and share your closest matches.">
    <meta name="referrer" content="no-referrer">
    <title>Your Personality Profile | Which Character Are You?</title>
    <link rel="stylesheet" href="styles/results.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to results</a>
    <header class="site-header">
        <a class="brand" href="index.html">Which Character Are You?</a>
        <a class="button button--secondary" href="muppets.html">Take the quiz</a>
    </header>
    <main id="main-content" class="results-shell" tabindex="-1">
        <div class="loading-card" data-loading>
            <p>Preparing your personality profile...</p>
            <p>If your profile does not appear, reload this page or <a href="muppets.html">take the quiz</a>.</p>
        </div>
        <div data-results-root></div>
        <noscript>
            <section class="notice-card">
                <h1>JavaScript is required</h1>
                <p>Enable JavaScript to calculate and visualize this profile. Your individual quiz answers are not included in shared links.</p>
                <a href="index.html">Back to home</a>
            </section>
        </noscript>
        <nav class="result-actions" aria-label="Next steps" data-result-actions hidden>
            <a class="button button--primary" href="muppets.html">Take the quiz again</a>
            <button class="button button--secondary" type="button" data-print>Print or save as PDF</button>
            <a href="index.html">Back to home</a>
        </nav>
    </main>
    <footer class="site-footer">
        <p>For fun and reflection, not a psychological assessment.</p>
        <a href="credits.html">Character image credits and licenses</a>
    </footer>
    <script type="module" src="js/results-page.js"></script>
</body>
</html>
